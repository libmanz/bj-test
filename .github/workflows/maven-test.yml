name: Java Test and Compile CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests with Maven
        run: mvn test
